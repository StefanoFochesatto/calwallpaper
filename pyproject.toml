[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calwallpaper"
version = "1.0.0"
description = "Dynamic live weekly calendar wallpaper widget for Linux with KDE Plasma 6 and Wayland"
authors = [
  { name = "Stefano Fochesatto", email = "stefano.gfochesatto@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["calendar", "wallpaper", "kde", "plasma", "wayland", "desktop-widget", "google-calendar"]
dependencies = [
  "cairosvg>=2.7.0",
  "icalendar>=5.0.0",
  "recurring-ical-events>=3.0.0",
  "pyyaml>=6.0",
  "requests>=2.28.0",
  "Pillow>=10.0.0",
  "PyQt6>=6.5.0",
]

[project.scripts]
calwallpaper = "calwallpaper.cli:main"
calwallpaper-settings = "calwallpaper.gui:launch_gui"
